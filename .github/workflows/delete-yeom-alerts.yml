name: Delete Yeom bot DM alerts

on:
  workflow_dispatch:

jobs:
  delete-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete every Yeom bot message in the target DM
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TARGET_CHANNEL: D0B2U2J8QNS
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          token = os.environ["SLACK_BOT_TOKEN"]
          channel = os.environ["TARGET_CHANNEL"]

          def api(method, payload=None):
              data = urllib.parse.urlencode(payload or {}).encode()
              request = urllib.request.Request(
                  f"https://slack.com/api/{method}",
                  data=data,
                  headers={"Authorization": f"Bearer {token}"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  raise RuntimeError(f"{method} failed: {result.get('error')}")
              return result

          auth = api("auth.test")
          bot_user_id = auth.get("user_id")
          bot_id = auth.get("bot_id")
          print(f"Authenticated bot user={auth.get('user')} user_id={bot_user_id} bot_id={bot_id}")

          messages = []
          cursor = ""
          while True:
              payload = {"channel": channel, "limit": 200}
              if cursor:
                  payload["cursor"] = cursor
              page = api("conversations.history", payload)
              messages.extend(page.get("messages", []))
              cursor = page.get("response_metadata", {}).get("next_cursor", "")
              if not cursor:
                  break

          targets = [
              message for message in messages
              if message.get("user") == bot_user_id
              or (bot_id and message.get("bot_id") == bot_id)
          ]
          print(f"Scanned={len(messages)} Targeted={len(targets)}")

          deleted = 0
          failures = []
          for message in targets:
              try:
                  api("chat.delete", {"channel": channel, "ts": message["ts"]})
                  deleted += 1
              except Exception as exc:
                  failures.append({"ts": message.get("ts"), "error": str(exc)})
              time.sleep(1.1)

          remaining = []
          cursor = ""
          while True:
              payload = {"channel": channel, "limit": 200}
              if cursor:
                  payload["cursor"] = cursor
              page = api("conversations.history", payload)
              remaining.extend(
                  message for message in page.get("messages", [])
                  if message.get("user") == bot_user_id
                  or (bot_id and message.get("bot_id") == bot_id)
              )
              cursor = page.get("response_metadata", {}).get("next_cursor", "")
              if not cursor:
                  break

          print(f"Deleted={deleted} Failed={len(failures)} Remaining={len(remaining)}")
          if failures:
              print(json.dumps(failures, ensure_ascii=False))
          if failures or remaining:
              raise SystemExit(1)
          PY
