name: Monitoring Summary RPC Parity

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Explicit KST business date (YYYY-MM-DD)"
        required: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compare legacy history scans with RPC summaries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/check_monitoring_collection_summary_parity.py --date "${{ inputs.date }}"
