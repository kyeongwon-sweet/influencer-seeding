name: Admin — Purge 여믄봇 DM messages

# 여믄봇이 **자기가 보낸** DM 메시지를 일괄 삭제. 수동 전용(스케줄 없음).
#
# 안전 설계
#  - `chat.delete`는 봇 토큰으로 **봇 자신의 메시지만** 지울 수 있다 → 사람이 쓴 메시지는 원리적으로 못 지운다.
#  - 기본은 dry_run=true(**세기만 하고 안 지움**). 실제 삭제는 dry_run=false **그리고** confirm에 정확히
#    `DELETE`를 입력해야 진행한다.
#  - 실제 삭제는 confirm에 **`DELETE <해석된 DM 채널 ID>`** 를 정확히 넣어야 진행한다(2026-10-14 재발방지).
#    앱 재설치·토큰 교체 뒤에는 사람이 보던 D… 채널과 봇이 해석한 DM이 다를 수 있다
#    (실제로 D0B2U2J8QNS 입력 → 봇은 D0B8FHE8R0A 를 잡음). dry-run이 보여 준 그 방에서만 지워지도록
#    확인 문자열을 방 ID에 묶는다. 방이 바뀌면 즉시 중단.
#  - dry-run은 토큰 봇 이름·대화 상대·최근 봇 메시지 3건을 출력한다 → 맞는 방인지 눈으로 확인 후 실행.
#  - `ts_list` + `U...` 입력은 원래 `chat.postMessage(channel=U...)` 대상 ID를 그대로 쓴다.
#    Slack은 이 경로를 사용자의 Slackbot/셀프 DM에 표시하지만 `conversations.open`은 별도 앱 DM을
#    반환할 수 있으므로, 이미 검증한 ts를 지울 때 임의로 `D...`로 바꾸면 안 된다.
#  - before(선택)로 "그 날짜 이전만" 지울 수 있다. 최근 알림은 남기고 옛것만 치울 때 쓴다.
#  - max로 한 번에 지울 최대 건수를 제한한다(사고 시 피해 범위 축소).
#  - ⚠️ 슬랙 메시지 삭제는 **되돌릴 수 없다.** 되돌리기 기능이 없다.
#    필요하면 dry_run으로 먼저 목록/건수를 확인하고, 로그를 남겨 두고 실행할 것.
#
# 필요 권한(SLACK_BOT_TOKEN 스코프): DM 읽기 `im:history`, 삭제 `chat:write`.
#   `im:history`가 없으면 conversations.history가 `missing_scope`로 실패한다 → 그때는 슬랙 앱 설정에서
#   스코프를 추가하고 재설치해야 한다.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "DM 채널 ID 또는 Slack 사용자 ID (황경원 = U0B2Y0ZC8QZ)"
        required: true
        default: "U0B2Y0ZC8QZ"
      before:
        description: "이 날짜(KST, YYYY-MM-DD) '이전' 메시지만 대상. 비우면 전체"
        required: false
        default: ""
      ts_list:
        description: "선택: 삭제할 ts 목록(콤마/줄바꿈 구분). 넣으면 DM 읽기를 건너뛴다 → im:history 스코프 불필요"
        required: false
        default: ""
      max:
        description: "한 번에 삭제할 최대 건수(안전장치)"
        required: true
        default: "200"
      dry_run:
        description: "true면 세기만 하고 삭제하지 않음"
        type: boolean
        default: true
      confirm:
        description: "실제 삭제: dry-run 로그 마지막 줄에 나온 'DELETE <채널ID>' 를 그대로 입력 (예: DELETE D0B8FHE8R0A)"
        required: false
        default: ""
      token_source:
        description: "삭제 토큰 위치. github=Actions secret, vercel=Production 런타임(2026-10-14 복구 전용)"
        type: choice
        options:
          - github
          - vercel
        default: github

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge bot DM messages
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ github.event.inputs.channel }}
          BEFORE: ${{ github.event.inputs.before }}
          TS_LIST: ${{ github.event.inputs.ts_list }}
          MAX: ${{ github.event.inputs.max }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CONFIRM: ${{ github.event.inputs.confirm }}
          TOKEN_SOURCE: ${{ github.event.inputs.token_source }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: "https://influencer-seeding-mu.vercel.app"
        run: |
          set -euo pipefail

          if [ "$DRY_RUN" != "true" ] && [[ "$CONFIRM" != DELETE\ * ]]; then
            echo "🛑 실제 삭제에는 confirm='DELETE <채널ID>' 가 필요합니다. 먼저 dry-run으로 방을 확인하세요. (지금 입력: '$CONFIRM')"
            exit 1
          fi

          # 실제 발송이 Vercel에서 이뤄졌다면 Production의 토큰이 GitHub secret과 다를 수 있다.
          # 비밀값을 꺼내지 않고 CRON_SECRET 보호 라우트가 그 토큰으로 삭제한다.
          if [ "$TOKEN_SOURCE" = "vercel" ]; then
            if [ -z "${CRON_SECRET:-}" ]; then echo "CRON_SECRET 없음"; exit 1; fi
            if [ -z "$TS_LIST" ]; then echo "Vercel 경로는 검증한 ts_list가 필수입니다"; exit 1; fi
            if ! [[ "$MAX" =~ ^[0-9]+$ ]] || [ "$MAX" -lt 1 ]; then echo "max는 양의 정수여야 합니다"; exit 1; fi

            echo "$TS_LIST" | tr ',' '\n' | tr -d ' \r' | grep -E '^[0-9]+\.[0-9]+$' > /tmp/ts.all || true
            head -n "$MAX" /tmp/ts.all > /tmp/ts.txt
            TOTAL=$(wc -l < /tmp/ts.txt | tr -d ' ')
            if [ "$TOTAL" -eq 0 ]; then echo "유효한 ts가 없습니다"; exit 1; fi
            split -l 35 -d -a 3 /tmp/ts.txt /tmp/ts-batch-

            ALL_DELETED=0; ALL_FAILED=0; BATCH=0
            for PART in /tmp/ts-batch-*; do
              BATCH=$((BATCH+1))
              TS_JSON=$(jq -Rsc 'split("\n") | map(select(length > 0))' "$PART")
              BODY=$(jq -n \
                --arg channel "$CHANNEL" \
                --arg confirm "$CONFIRM" \
                --argjson dryRun "$DRY_RUN" \
                --argjson timestamps "$TS_JSON" \
                '{channel:$channel, confirm:$confirm, dryRun:$dryRun, timestamps:$timestamps}')
              OUTPUT="/tmp/vercel-purge-$BATCH.json"
              CODE=$(curl --silent --show-error --max-time 70 \
                -o "$OUTPUT" -w "%{http_code}" \
                -X POST "${APP_URL%/}/api/ops/purge-yeomun-self-dm-20261014" \
                -H "Authorization: Bearer $CRON_SECRET" \
                -H "Content-Type: application/json" \
                --data "$BODY")
              cat "$OUTPUT"; echo ""; echo "HTTP $CODE"
              [ "${CODE:0:1}" = "2" ] || exit 1
              DELETED=$(jq -r '.deleted // 0' "$OUTPUT")
              FAILED=$(jq -r '.failed // 0' "$OUTPUT")
              ALL_DELETED=$((ALL_DELETED+DELETED))
              ALL_FAILED=$((ALL_FAILED+FAILED))
            done
            echo "Vercel 토큰 경로 합계: 삭제 $ALL_DELETED건 / 실패 $ALL_FAILED건 / 입력 $TOTAL건"
            [ "$ALL_FAILED" -eq 0 ] || exit 1
            exit 0
          fi

          if [ -z "${SLACK_BOT_TOKEN:-}" ]; then echo "SLACK_BOT_TOKEN 없음"; exit 1; fi

          # 토큰이 어느 봇인지 먼저 밝힌다(여믄봇/다른 봇 토큰 혼동 방지).
          AUTH=$(curl -s -X POST https://slack.com/api/auth.test -H "Authorization: Bearer $SLACK_BOT_TOKEN" || true)
          if [ "$(echo "$AUTH" | jq -r '.ok')" != "true" ]; then
            echo "auth.test 실패: $(echo "$AUTH" | jq -r '.error // "unknown"')"; exit 1
          fi
          BOT_USER=$(echo "$AUTH" | jq -r '.user // ""')
          BOT_ID=$(echo "$AUTH" | jq -r '.bot_id // ""')
          echo "토큰 봇: ${BOT_USER:-?} (bot_id=${BOT_ID:-?}, team=$(echo "$AUTH" | jq -r '.team // "?"'))"

          # 사용자 ID가 들어오면 여믄봇 관점의 현재 DM 채널 ID로 해석한다.
          # 앱 재설치·토큰 교체 뒤에는 사람이 보는 예전 D... 링크와 봇이 접근할 수 있는
          # DM 채널이 달라질 수 있으므로 사용자 ID가 더 안정적인 입력이다.
          # 단, ts_list는 이미 사람이 검증한 메시지 ID를 원래 chat.postMessage 대상(U...)에서
          # 지우는 복구 경로다. 이때 conversations.open으로 바꾸면 별도 앱 DM(D...)을 잡아
          # 셀프 DM 메시지를 전부 channel_not_found로 놓친다.
          DELETE_AS_USER_ARGS=()
          if [[ "$CHANNEL" == U* ]] && [ -z "$TS_LIST" ]; then
            OPEN_RESP=$(curl -s -X POST https://slack.com/api/conversations.open \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-type: application/x-www-form-urlencoded" \
              --data-urlencode "users=$CHANNEL")
            if [ "$(echo "$OPEN_RESP" | jq -r '.ok')" != "true" ]; then
              echo "conversations.open 실패: $(echo "$OPEN_RESP" | jq -r '.error // "unknown"')"
              exit 1
            fi
            CHANNEL=$(echo "$OPEN_RESP" | jq -r '.channel.id')
            echo "사용자 ID에서 DM 채널 해석 완료: $CHANNEL"
          elif [[ "$CHANNEL" == U* ]]; then
            echo "ts_list 입력 — 원래 메시지 대상 사용자 ID 유지: $CHANNEL"
            # chat.postMessage(channel=U...)로 만들어진 Slackbot/셀프 DM은 현재 봇의
            # D... 채널로 다시 열리지 않는다. 이 복구 경로에서만 메시지를 쓴 주체로
            # 삭제하도록 요청한다. 다른 방/일반 DM 삭제에는 적용하지 않는다.
            DELETE_AS_USER_ARGS+=(--data-urlencode "as_user=true")
          fi

          # 어느 방인지 밝힌다. conversations.info(im:read)가 없으면 '확인 불가'로만 표기하고 진행.
          INFO=$(curl -s -G https://slack.com/api/conversations.info             -H "Authorization: Bearer $SLACK_BOT_TOKEN" --data-urlencode "channel=$CHANNEL" || true)
          PEER=$(echo "$INFO" | jq -r 'if .ok then (.channel.user // "") else "" end' 2>/dev/null || true)
          if [ -n "$PEER" ]; then echo "대상 방: $CHANNEL · 대화 상대: $PEER"
          else echo "대상 방: $CHANNEL · 대화 상대: 확인 불가($(echo "$INFO" | jq -r '.error // "?"' 2>/dev/null || echo '?'))"; fi

          # 실제 삭제는 dry-run에서 본 '바로 그 방'일 때만. 방이 바뀌었으면(토큰 교체 등) 지우지 않는다.
          EXPECTED_CONFIRM="DELETE $CHANNEL"
          if [ "$DRY_RUN" != "true" ] && [ "$CONFIRM" != "$EXPECTED_CONFIRM" ]; then
            echo "🛑 확인 문자열이 해석된 방과 다릅니다 → 삭제하지 않습니다."
            echo "   입력: '$CONFIRM' / 이 방을 지우려면: '$EXPECTED_CONFIRM'"
            echo "   방이 의도와 다르면 dry-run으로 최근 메시지를 먼저 확인하세요."
            exit 1
          fi

          # before(KST 날짜) → epoch. 슬랙 ts는 UTC epoch라 KST 자정을 UTC로 환산한다.
          LATEST=""
          if [ -n "$BEFORE" ]; then
            LATEST=$(date -u -d "$BEFORE 00:00:00 +0900" +%s)
            echo "대상: $BEFORE(KST) 이전 → ts < $LATEST"
          else
            echo "대상: 전체 기간"
          fi

          # 1) 봇이 보낸 메시지 ts 수집.
          : > /tmp/ts.txt; : > /tmp/other.txt; : > /tmp/sample.txt
          PAGES=0

          # 1-a) ts_list를 받았으면 DM을 읽지 않는다 → `im:history` 스코프가 없어도 동작한다.
          #      (여믄봇은 DM에 '쓰기'만 해왔으므로 읽기 권한이 없을 수 있다)
          #      chat.delete는 여전히 봇 자기 메시지만 지우므로, 남의 ts를 넣어도 지워지지 않는다.
          if [ -n "$TS_LIST" ]; then
            echo "$TS_LIST" | tr ',' '\n' | tr -d ' \r' | grep -E '^[0-9]+\.[0-9]+$' > /tmp/ts.txt || true
            GIVEN=$(wc -l < /tmp/ts.txt | tr -d ' ')
            echo "ts_list 입력 사용 — 유효한 ts $GIVEN건 (DM 읽기 건너뜀)"
            if [ "$GIVEN" -eq 0 ]; then echo "🛑 ts 형식이 올바르지 않습니다(예: 1783072409.266399)"; exit 1; fi
          else

          CURSOR=""
          while : ; do
            PAGES=$((PAGES+1))
            ARGS=(
              --data-urlencode "channel=$CHANNEL"
              --data-urlencode "limit=200"
            )
            [ -n "$LATEST" ] && ARGS+=(--data-urlencode "latest=$LATEST")
            [ -n "$CURSOR" ] && ARGS+=(--data-urlencode "cursor=$CURSOR")
            RESP=$(curl -s -G "https://slack.com/api/conversations.history" \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" "${ARGS[@]}" || true)
            OK=$(echo "$RESP" | jq -r '.ok')
            if [ "$OK" != "true" ]; then
              echo "conversations.history 실패: $(echo "$RESP" | jq -r '.error // "unknown"')"
              exit 1
            fi
            # 봇 메시지 판별: 이 토큰의 봇(bot_id)이 쓴 것만 — chat.delete가 지울 수 있는 것만 센다.
            # (bot_id를 못 얻으면 예전처럼 봇 메시지 전체)
            echo "$RESP" | jq -r --arg b "$BOT_ID"               '.messages[] | select(.bot_id != null and ($b == "" or .bot_id == $b)) | .ts' >> /tmp/ts.txt
            echo "$RESP" | jq -r --arg b "$BOT_ID"               '.messages[] | select(.bot_id != null and $b != "" and .bot_id != $b) | .ts' >> /tmp/other.txt || true
            if [ "$PAGES" -eq 1 ]; then
              echo "$RESP" | jq -r --arg b "$BOT_ID" '[.messages[] | select(.bot_id != null and ($b == "" or .bot_id == $b))] | .[0:3][] | "  · \(.ts)  \((.text // "") | gsub("\n"; " ") | .[0:80])"' > /tmp/sample.txt || true
            fi
            CURSOR=$(echo "$RESP" | jq -r '.response_metadata.next_cursor // ""')
            [ -z "$CURSOR" ] && break
            sleep 1.2   # conversations.history 레이트리밋(Tier 3) 여유
          done

          fi   # ts_list 분기 끝

          TOTAL=$(wc -l < /tmp/ts.txt | tr -d ' ')
          sort -n /tmp/ts.txt > /tmp/ts.sorted
          echo "----------------------------------------"
          echo "페이지 $PAGES · 봇 메시지 $TOTAL건 발견"
          echo "가장 오래된/최신 ts:"; head -1 /tmp/ts.sorted; tail -1 /tmp/ts.sorted
          OTHER=$(wc -l < /tmp/other.txt | tr -d ' ')
          [ "$OTHER" -gt 0 ] && echo "다른 봇 메시지 ${OTHER}건은 이 토큰으로 못 지우므로 제외"
          if [ -s /tmp/sample.txt ]; then echo "이 방의 최근 봇 메시지(맞는 방인지 확인):"; cat /tmp/sample.txt
          else echo "최근 메시지 견본 없음(ts_list 입력이거나 봇 메시지 0건)"; fi
          echo "----------------------------------------"

          if [ "$DRY_RUN" = "true" ]; then
            echo "🔎 dry-run — 아무것도 지우지 않았습니다."
            echo "위 방이 맞으면: dry_run=false, confirm='$EXPECTED_CONFIRM' 로 다시 실행하세요."
            exit 0
          fi

          # 2) 삭제. 오래된 것부터, max까지만. chat.delete는 Tier 3(분당 약 50) → 1.3초 간격.
          DONE=0; FAILED=0
          for TS in $(cat /tmp/ts.sorted); do
            if [ "$DONE" -ge "$MAX" ]; then echo "max($MAX) 도달 — 중단"; break; fi
            RESP=$(curl -s -X POST https://slack.com/api/chat.delete \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-type: application/x-www-form-urlencoded" \
              --data-urlencode "channel=$CHANNEL" --data-urlencode "ts=$TS" \
              "${DELETE_AS_USER_ARGS[@]}")
            if echo "$RESP" | jq -e '.ok' >/dev/null; then
              DONE=$((DONE+1))
            else
              FAILED=$((FAILED+1))
              echo "실패 ts=$TS: $(echo "$RESP" | jq -r '.error // "unknown"')"
            fi
            sleep 1.3
          done

          echo "----------------------------------------"
          echo "삭제 $DONE건 / 실패 $FAILED건 / 발견 $TOTAL건"
          [ "$TOTAL" -gt "$DONE" ] && echo "남은 $((TOTAL - DONE))건은 다시 실행하면 이어서 지웁니다."
          exit 0
