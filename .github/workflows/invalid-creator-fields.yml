name: Invalid Creator Fields Audit

on:
  schedule:
    - cron: "25 0 * * *" # 09:25 KST, dailyAuto(08:30)/formula-audit(09:10) afterglow
    #                     2026-08-06 아침 배치 1시간 앞당김(10:25 → 09:25)
  workflow_dispatch:
    inputs:
      apply:
        description: "Clear selected invalid fields after backup"
        type: boolean
        default: false
      fields:
        description: "Fields to clear when apply=true"
        type: choice
        options:
          - creator
          - planner
          - both
        default: creator
      limit:
        description: "Optional max rows to update; 0 means all"
        required: false
        default: "0"
      send:
        description: "Send Slack if issues exist"
        type: boolean
        default: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      STATUS_USER: U0B2Y0ZC8QZ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Audit and optionally repair invalid creator fields
        run: |
          args=(
            --fields "${{ github.event.inputs.fields || 'creator' }}"
            --limit "${{ github.event.inputs.limit || '0' }}"
          )
          if [ "${{ github.event.inputs.apply || 'false' }}" = "true" ]; then
            args+=(--apply)
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.send }}" = "true" ]; then
            args+=(--send)
          fi
          python scripts/audit_invalid_creator_fields.py "${args[@]}"
      - name: Upload repair backup
        if: ${{ (github.event.inputs.apply || 'false') == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: invalid-creator-fields-backup-${{ github.run_id }}
          path: scratchpad/invalid_creator_fields_backup_*.json
          if-no-files-found: error
