name: 런치랩 1회성 메시지 발송

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 삭제 및 기존 메시지 편집
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_LUNCHLAB_BOT_TOKEN }}
        run: |
          python3 - <<'EOF'
          import urllib.request, json, os, sys

          TOKEN = os.environ['SLACK_BOT_TOKEN']
          CHANNEL = 'C0BFPQAPHEK'
          DELETE_TS = '1787287387.993679'

          NEW_TEXT = (
              '안녕하세요, 런치랩입니다.\n'
              '주문 관련 안내드립니다.\n'
              '\n'
              '>최소주문수량 : 3\n'
              '>현재 주문개수 : 2\n'
              '\n'
              '최소주문수량 미달 시 주문이 취소될 수 있습니다.\n'
              '*오후 5시*까지 주문을 확정해주시기 바랍니다.\n'
              '\n'
              '감사합니다.'
          )

          def api(endpoint, payload):
              data = json.dumps(payload, ensure_ascii=False).encode('utf-8')
              req = urllib.request.Request(
                  f'https://slack.com/api/{endpoint}', data=data,
                  headers={'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json; charset=utf-8'}
              )
              return json.load(urllib.request.urlopen(req, timeout=15))

          # 1. 채널 히스토리에서 기존 메시지 ts 찾기 (삭제 대상 직전 메시지)
          r = api('conversations.history', {
              'channel': CHANNEL,
              'latest': DELETE_TS,
              'limit': 10
          })
          msgs = r.get('messages', [])
          # 봇이 보낸 "최소주문수량 : 3" 포함 메시지 찾기 (블록쿼트 없는 버전)
          old_ts = None
          for m in msgs:
              if '최소주문수량 : 3' in m.get('text', '') and '>최소주문수량' not in m.get('text', ''):
                  old_ts = m['ts']
                  print(f'기존 메시지 ts: {old_ts}')
                  break
          if not old_ts:
              print('기존 메시지를 찾지 못했습니다.')
              sys.exit(1)

          # 2. 새로 보낸 메시지 삭제
          r = api('chat.delete', {'channel': CHANNEL, 'ts': DELETE_TS})
          print('삭제:', r.get('ok'), r.get('error', ''))

          # 3. 기존 메시지 편집 (blocks로 mrkdwn 강제 렌더링)
          blocks = [{'type': 'section', 'text': {'type': 'mrkdwn', 'text': NEW_TEXT}}]
          r = api('chat.update', {'channel': CHANNEL, 'ts': old_ts, 'text': NEW_TEXT, 'blocks': blocks})
          print('편집:', r.get('ok'), r.get('error', ''))
          if not r.get('ok'):
              sys.exit(1)
          EOF
