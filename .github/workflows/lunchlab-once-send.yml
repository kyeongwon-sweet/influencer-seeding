name: 런치랩 1회성 메시지 발송

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 9월 3주차 식단표 발송
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_LUNCHLAB_BOT_TOKEN }}
        run: |
          python3 - <<'EOF'
          import urllib.request, json, os, sys

          TOKEN = os.environ['SLACK_BOT_TOKEN']
          CHANNEL = 'C0BFPQAPHEK'

          imgs = [
              'https://images.ctfassets.net/r2ug8n4acrsb/m8tOVKhKrZ8egMjOhDHRJ/66433d6164c2101429626ed4ae8ba842/6f1a9e84-5274-4bdd-848a-cf87ceccf3f5.png',
              'https://images.ctfassets.net/r2ug8n4acrsb/1kRUJAdVtWdYMlMHQyy1Ya/85bfbb6b75e9abab23bafda3ccd92a15/ec7e328a-a6ef-475b-9e7e-a8fcff865fcb.png',
              'https://images.ctfassets.net/r2ug8n4acrsb/5OU5aHdVnndnRzunVuA8fH/2191756d7f5f5b8e8168151ae2532a25/e7f99a06-8f74-4f67-bfac-7e915ac824b1.png',
          ]
          titles = ['가정식 도시락', '프레시밀', '라이트밀']
          week_label = '9월 3주차'

          blocks = [
              {
                  'type': 'section',
                  'text': {
                      'type': 'mrkdwn',
                      'text': f':rice: *이번 주 런치랩 식단표 ({week_label})*\n:fork_and_knife: <https://www.lunchlab.me/menu|메뉴 보러가기>'
                  }
              }
          ]
          for i, url in enumerate(imgs):
              blocks.append({
                  'type': 'image',
                  'title': {'type': 'plain_text', 'text': titles[i]},
                  'image_url': url,
                  'alt_text': f'{week_label} {titles[i]}'
              })

          payload = json.dumps({'channel': CHANNEL, 'blocks': blocks}, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(
              'https://slack.com/api/chat.postMessage', data=payload,
              headers={'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json; charset=utf-8'}
          )
          r = json.load(urllib.request.urlopen(req, timeout=15))
          print('ok:', r.get('ok'), 'error:', r.get('error', ''))
          if not r.get('ok'):
              sys.exit(1)
          EOF
