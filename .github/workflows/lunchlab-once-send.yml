name: 런치랩 1회성 메시지 발송

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 10월 2주차 식단표 발송 + 이전 메시지 삭제
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_LUNCHLAB_BOT_TOKEN }}
        run: |
          python3 - <<'EOF'
          import urllib.request, json, os, sys

          TOKEN = os.environ['SLACK_BOT_TOKEN']
          CHANNEL = 'C0BFPQAPHEK'
          DELETE_TS = '1791206923.994769'

          # 10월 2주차 이미지 (페이지에서 4~6번째 이미지)
          imgs = [
              'https://images.ctfassets.net/r2ug8n4acrsb/4TWU8jC7mSx49BlW0SVRuR/f943317dd3c27164c89f4e80cc352d2c/9ba018fd-54e2-40a6-9b9f-e6e4401e59a0.png',
              'https://images.ctfassets.net/r2ug8n4acrsb/4icQExRoz5jZCPlmw8phvn/b52bcb725ee30e007c7e33a787fc6051/1743ace7-0936-4d5c-9586-1750586eaecf.png',
              'https://images.ctfassets.net/r2ug8n4acrsb/6rzK5USXkWW0zQCC7YFMza/594fafb192bec3c9bee874e9fcdd979e/fbf2161e-4e71-4a5f-bd0d-ebc8491c18e9.png',
          ]
          titles = ['가정식 도시락', '프레시밀', '라이트밀']
          week_label = '10월 2주차'

          def api(endpoint, payload):
              data = json.dumps(payload, ensure_ascii=False).encode('utf-8')
              req = urllib.request.Request(
                  f'https://slack.com/api/{endpoint}', data=data,
                  headers={'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json; charset=utf-8'}
              )
              return json.load(urllib.request.urlopen(req, timeout=15))

          # 1. 잘못 보낸 메시지 삭제
          r = api('chat.delete', {'channel': CHANNEL, 'ts': DELETE_TS})
          print('삭제:', r.get('ok'), r.get('error', ''))

          # 2. 올바른 주차 이미지로 발송
          blocks = [
              {
                  'type': 'section',
                  'text': {
                      'type': 'mrkdwn',
                      'text': f':rice: *이번 주 런치랩 식단표 ({week_label})*\n:fork_and_knife: <https://www.lunchlab.me/menu|메뉴 보러가기>'
                  }
              }
          ]
          for i, url in enumerate(imgs):
              blocks.append({
                  'type': 'image',
                  'title': {'type': 'plain_text', 'text': titles[i]},
                  'image_url': url,
                  'alt_text': f'{week_label} {titles[i]}'
              })

          r = api('chat.postMessage', {'channel': CHANNEL, 'blocks': blocks})
          print('발송:', r.get('ok'), r.get('error', ''))
          if not r.get('ok'):
              sys.exit(1)
          EOF
