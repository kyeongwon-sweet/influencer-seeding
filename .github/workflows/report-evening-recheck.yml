name: Report evening recheck (19:10 KST)

# 저녁 재확인 — 이미 나간 '어제' 증분 리포트를 대시보드 숫자로 다시 맞춘다(사용자 결정 2026-11-16 "대시보드랑 맞춰줘").
#   리포트(12:20) 뒤에 늦게 등록된 글(주로 위성채널)의 첫 조회수가 오후 재수집(11/14/17시, 17시분은 ~17:50 끝)으로
#   '어제'에 기록돼 대시보드와 리포트가 갈렸다(10/27 +9,138 · 10/28 +8,494 · 11/15 +6,601).
#   - 숫자가 같으면 아무것도 안 한다. 다르면 그 메시지를 그 자리에서 편집(chat.update, 댓글 유지) + 운영자 DM(이전→이후).
#   - 검수 BLOCK(시트 열 밀림 등)이면 고치지 않고 운영자 DM만 — 자동 편집이 잘못된 숫자로 덮어쓰지 않게.
#   - 재실행 안전(같으면 무동작)이라 21:40 백업 크론을 둔다(GitHub 크론 지연·드롭 대비).
on:
  schedule:
    - cron: "10 10 * * *"   # 19:10 KST
    - cron: "40 12 * * *"   # 21:40 KST backup (재실행 안전)
  workflow_dispatch:
    inputs:
      date:
        description: "재확인할 리포트 날짜(YYYY-MM-DD, 비우면 어제 KST)"
        type: string
        default: ""
      product:
        description: "수동 실행 대상(jd=쫀득바, kbong=크봉, pbachi=바치케-중단됨). 예약 실행은 쫀득바·크봉"
        type: choice
        options: [jd, kbong, pbachi]
        default: jd

jobs:
  recheck:
    strategy:
      fail-fast: false
      matrix:
        product: [jd, kbong, pbachi]
    # 수동 실행은 고른 제품만, 예약 실행은 쫀득바·크봉(바치케는 2026-11-25 리포트 중단 → 수동만).
    if: github.event_name == 'schedule' || github.event.inputs.product != ''
    concurrency:
      group: report-evening-recheck-${{ matrix.product }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 대상 제품 확인
        id: gate
        run: |
          if { [ "${{ github.event_name }}" = "schedule" ] && [ "${{ matrix.product }}" != "pbachi" ]; } || [ "${{ github.event.inputs.product }}" = "${{ matrix.product }}" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == '1'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == '1'
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        if: steps.gate.outputs.run == '1'
        run: pip install -r requirements.txt
      - name: 어제 리포트 재확인·편집
        if: steps.gate.outputs.run == '1'
        env:
          REPORT_PRODUCT: ${{ matrix.product }}
          RECHECK: "1"
          STRICT_DATE: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          APP_URL: "https://influencer-seeding-mu.vercel.app"
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: |
          export MONITORING_DATE="${{ github.event.inputs.date }}"
          [ -z "$MONITORING_DATE" ] && export MONITORING_DATE=$(TZ=Asia/Seoul date -d 'yesterday' +%F)
          cd scripts && python notify_increments.py
      # 조용한 실패 방지: 재확인 자체가 실패하면 운영자에게 바로 알린다.
      - name: 실패 알림(운영자 DM)
        if: failure() && steps.gate.outputs.run == '1'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            --data-urlencode "channel=U0B2Y0ZC8QZ" \
            --data-urlencode "text=⚠️ 저녁 재확인(${{ matrix.product }}) 실패 — 어제 리포트를 대시보드와 맞추지 못했어요. $RUN_URL" \
            -o /dev/null -w "dm http=%{http_code}\n"
