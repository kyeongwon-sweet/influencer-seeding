name: Repair Specific Daily Stat

on:
  workflow_dispatch:
    inputs:
      stat_id:
        description: "post_daily_stats.id, or AUTO to find the unique post/date row"
        required: false
        default: "AUTO"
      post_id:
        description: "Expected sponsored_posts.id"
        required: true
      measured_at:
        description: "Expected measured_at date, YYYY-MM-DD"
        required: true
      expected_play_count:
        description: "Expected current play_count, NULL, or ANY for dry-run inspection"
        required: true
      new_play_count:
        description: "New play_count, or NULL"
        required: true
        default: "NULL"
      expected_manual:
        description: "Expected current manual flag: KEEP, true, or false"
        required: false
        default: "KEEP"
      new_manual:
        description: "New manual flag: KEEP, true, or false"
        required: false
        default: "KEEP"
      inspect_url_contains:
        description: "Optional URL substring to inspect in sponsored_posts"
        required: false
        default: ""
      apply:
        description: "Apply update after strict verification"
        type: boolean
        default: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify and optionally repair one stat row
        run: |
          args=(
            --stat-id "${{ inputs.stat_id }}"
            --post-id "${{ inputs.post_id }}"
            --measured-at "${{ inputs.measured_at }}"
            --expected-play-count "${{ inputs.expected_play_count }}"
            --new-play-count "${{ inputs.new_play_count }}"
            --expected-manual "${{ inputs.expected_manual }}"
            --new-manual "${{ inputs.new_manual }}"
            --inspect-url-contains "${{ inputs.inspect_url_contains }}"
            --out "../data/output/repair-specific-daily-stat-${{ inputs.stat_id }}.json"
          )
          if [ "${{ inputs.apply }}" = "true" ]; then
            args+=(--apply)
          fi
          cd scripts
          python repair_specific_daily_stat.py "${args[@]}"
      - name: Upload guarded repair audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-specific-daily-stat-${{ inputs.stat_id }}-${{ github.run_id }}
          path: data/output/repair-specific-daily-stat-${{ inputs.stat_id }}.json
          if-no-files-found: warn
