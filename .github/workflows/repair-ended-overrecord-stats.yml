name: Repair Ended Overrecord Stats

on:
  workflow_dispatch:
    inputs:
      date:
        description: "measured_at date to inspect/delete"
        required: true
        default: "2026-07-28"
      apply:
        description: "Delete matching rows after backup"
        type: boolean
        default: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Inspect or repair ended overrecord stats
        run: |
          cd scripts
          if [ "${{ inputs.apply }}" = "true" ]; then
            python repair_ended_overrecord_stats.py --date "${{ inputs.date }}" --apply
          else
            python repair_ended_overrecord_stats.py --date "${{ inputs.date }}"
          fi
      - name: Inspect or repair status integrity anomalies
        run: |
          cd scripts
          if [ "${{ inputs.apply }}" = "true" ]; then
            python repair_status_integrity_anomalies.py --apply
          else
            python repair_status_integrity_anomalies.py
          fi
      - name: Upload backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ended-overrecord-backup-${{ inputs.date }}-${{ github.run_id }}
          path: data/backups/*.json
          if-no-files-found: ignore
