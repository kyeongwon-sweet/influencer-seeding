name: Sheet Formula Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"   # 10:30 KST, after the 09:30 Apps Script dailyAuto window

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit linked sheet H/I display
        run: python scripts/audit_linked_sheet_formulas.py --max-h-value-i-blank 10
