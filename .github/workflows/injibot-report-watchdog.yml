name: Injibot Report Watchdog

# 재발방지(2026-08-27 사고): injibot-daily-report(06:38 KST)가 GHA 크론 드롭으로 미실행 →
# 자정수집 성공/실패 요약이 채널(#빙과_마케팅_스틱바p, C0B659HEYDV)에 하루 통째로 안 올라옴.
# 이 워치독이 08:20 KST에 '오늘 리포트 성공 실행'이 있는지 확인해, 없으면(드롭/실패)
# 동일 리포트를 대신 발송(self-heal)한다. 정상일엔 아무 것도 안 하므로 중복 발송 없음.
# ⚠️ primary와 다른 시각의 독립 크론 — 둘 다 드롭할 확률을 낮춘다.
on:
  schedule:
    - cron: "20 23 * * *"   # 08:20 KST (primary 06:38 이후 여유)
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 오늘 리포트 성공 실행 확인
        id: chk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list -R "${{ github.repository }}" --workflow=injibot-daily-report.yml -L 15 \
            --json createdAt,conclusion > runs.json || echo '[]' > runs.json
          now=$(date -u +%s)
          # 최근 6h 내 성공 실행이 있으면 오늘 primary 정상 → 발송 불필요(need=0)
          need=$(jq --argjson now "$now" '
            if [ .[] | select(.conclusion=="success")
                     | (.createdAt|fromdateiso8601)
                     | select($now - . < 21600) ] | length > 0
            then 0 else 1 end' runs.json)
          echo "need=$need" >> "$GITHUB_OUTPUT"
          echo "self-heal 필요: $need (0=정상, 1=오늘 성공실행 없음 → 대신 발송)"
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.need == '1'
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: steps.chk.outputs.need == '1'
        run: pip install supabase==2.15.1
      - name: Check overdue auto-end backlog
        if: steps.chk.outputs.need == '1'
        id: auto_end_watchdog
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TZ: "Asia/Seoul"
        run: |
          target_date=$(TZ=Asia/Seoul date +%F)
          python scripts/reconcile_auto_end.py \
            --target-date "$target_date" \
            --end-only \
            --out data/output/auto-end-watchdog.json
      - name: (self-heal) 리포트 대신 발송
        if: steps.chk.outputs.need == '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INJIBOT_SLACK_TOKEN: ${{ secrets.INJIBOT_SLACK_TOKEN }}
          PYTHONUTF8: "1"
          TZ: "Asia/Seoul"
          AUTO_END_WATCHDOG_REPORT: data/output/auto-end-watchdog.json
          AUTO_END_WATCHDOG_OUTCOME: ${{ steps.auto_end_watchdog.outcome }}
        run: python scripts/daily_collect_report.py --send
