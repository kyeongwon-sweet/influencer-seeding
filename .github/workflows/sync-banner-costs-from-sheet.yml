name: Sync Banner Costs From Sheet

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply linked-sheet costs to DB after backup"
        type: boolean
        default: false
      expected_count:
        description: "Fail closed unless candidate count matches"
        required: true
        default: "0"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: "https://influencer-seeding-mu.vercel.app"
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Sync banner costs
        run: |
          cd scripts
          args=(--expected-count "${{ inputs.expected_count }}")
          if [ "${{ inputs.apply }}" = "true" ]; then
            args+=(--apply)
          fi
          python sync_banner_costs_from_sheet.py "${args[@]}"
      - name: Upload backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banner-cost-sync-backup-${{ github.run_id }}
          path: scripts/data/backups/banner_cost_sync_*.json
          if-no-files-found: error
