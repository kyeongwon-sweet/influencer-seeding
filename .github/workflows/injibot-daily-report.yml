name: Injibot Daily Collect Report

# 자정수집 요약(배너제외 확보율)+실패상세 스레드를 인지봇으로 Slack #빙과_마케팅_스틱바p(C0B659HEYDV)에 발송.
#
# 재발방지(2026-08-27): 단일 GHA 크론(06:38) 하나에만 의존해 GitHub이 그 크론을 드롭하면
#   요약이 하루 통째로 안 올라오던 문제 → 근본해결로 **독립 크론 3개(06:38·07:38·08:38 KST)**로 다중화.
#   report.py는 같은 날 요약이 채널에 이미 있으면 스킵(idempotency)하므로 어느 하나만 떠도 정확히 1회 발송,
#   3개가 모두 드롭될 확률은 매우 낮다. (별도 감지형 워치독 대신 '리포트가 확실히 발사되게' 하는 방식)
# ⚠️ 필요한 GitHub Secret: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, INJIBOT_SLACK_TOKEN.
#   idempotency는 conversations.history를 쓰므로 봇 토큰에 channels:history(또는 groups:history) 권장 —
#   없으면 조회 실패 시 '누락<중복' 원칙으로 발송(최악은 중복, 미발송 아님).
on:
  schedule:
    - cron: "38 21 * * *"   # 06:38 KST (자정수집 이후)
    - cron: "38 22 * * *"   # 07:38 KST (크론 드롭 대비 다중화)
    - cron: "38 23 * * *"   # 08:38 KST (크론 드롭 대비 다중화)
  workflow_dispatch:        # 수동 실행
    inputs:
      force:
        description: "중복방지 무시하고 강제 발송(정정 재발송용)"
        required: false
        default: "false"

concurrency:
  group: injibot-daily-report
  cancel-in-progress: false

# 발송 게이트(대상일 수집 완료 확인)가 수집 워크플로 실행 이력을 조회한다.
permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install supabase==2.15.1
      - name: Check overdue auto-end backlog
        id: auto_end_watchdog
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TZ: "Asia/Seoul"
        run: |
          target_date=$(TZ=Asia/Seoul date +%F)
          python scripts/reconcile_auto_end.py \
            --target-date "$target_date" \
            --end-only \
            --out data/output/auto-end-watchdog.json
      # 2026-10-20: 미수집 사유(게시일 불일치 등)를 리포트에 붙이려고 최근 수집·재시도 실행의
      # view_missing_events_*.jsonl 을 받아 둔다(view-tracking-watchdog 와 같은 방식). 실패해도 리포트는 간다.
      - name: Download recent collector diagnostics (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/collect_diag"
          for wf in cron-daily-collect.yml monitoring-retry.yml; do
            for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --limit 3 --json databaseId -q '.[].databaseId'); do
              gh run download "$id" -R "$GITHUB_REPOSITORY" --pattern 'missing-view-diagnostics-*' -D "$RUNNER_TEMP/collect_diag/$id" || true
            done
          done
          find "$RUNNER_TEMP/collect_diag" -name 'view_missing_events_*.jsonl' | head -20
      - name: Send injibot daily report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INJIBOT_SLACK_TOKEN: ${{ secrets.INJIBOT_SLACK_TOKEN }}
          # 확인 필요 항목이 있는 날 요약 댓글에 태그할 담당자(쉼표 목록). 비우면 제품별 담당: 파인트 이재원·김보나 / 쫀득바 김바다·권예원(collect_report_thread.PRODUCT_ASSIGNEES)
          COLLECT_ALERT_ASSIGNEES: ${{ vars.COLLECT_ALERT_ASSIGNEES }}
          PYTHONUTF8: "1"
          TZ: "Asia/Seoul"
          AUTO_END_WATCHDOG_REPORT: data/output/auto-end-watchdog.json
          AUTO_END_WATCHDOG_OUTCOME: ${{ steps.auto_end_watchdog.outcome }}
          FORCE_FLAG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
          # 대상일 수집이 끝나기 전 발송을 막는 게이트용(없으면 게이트 비활성 = 기존 동작)
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/daily_collect_report.py --send $FORCE_FLAG --diag-dir "$RUNNER_TEMP/collect_diag"
