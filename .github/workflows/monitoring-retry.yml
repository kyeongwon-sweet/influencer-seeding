name: Monitoring Backup & Retry

# Safety retry for monitoring collection.
# It runs only when tracked, view-capable posts are missing today's play_count rows,
# unless manually dispatched or on the designated full top-up schedule.

on:
  schedule:
    - cron: "0 2,5,8 * * *"  # 11/14/17 KST
  workflow_dispatch:
    inputs:
      recollect_all:
        description: "Force recollect all posts for MONITORING_DATE"
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check today (KST) data
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          export TODAY_KST=$(TZ=Asia/Seoul date -d 'yesterday' +%F)
          cd scripts
          python build_view_missing_queue.py --date "$TODAY_KST" --out-dir "$RUNNER_TEMP"
          SUMMARY_FILE="$RUNNER_TEMP/view_missing_queue_${TODAY_KST}.json"
          RETRYABLE=$(python -c "import json, os; print(json.load(open(os.environ['SUMMARY_FILE'], encoding='utf-8'))['retryable_count'])")
          QUEUE_COUNT=$(python -c "import json, os; print(json.load(open(os.environ['SUMMARY_FILE'], encoding='utf-8'))['queue_count'])")
          ELIGIBLE=$(python -c "import json, os; print(json.load(open(os.environ['SUMMARY_FILE'], encoding='utf-8'))['eligible'])")
          if [ "$RETRYABLE" -gt 0 ]; then STATUS=missing; else STATUS=ok; fi
          echo "view_queue eligible=${ELIGIBLE} queue=${QUEUE_COUNT} retryable=${RETRYABLE}"
          echo "today(${TODAY_KST}) => ${STATUS}"
          echo "kdate=${TODAY_KST}" >> "$GITHUB_OUTPUT"
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "retryable=${RETRYABLE}" >> "$GITHUB_OUTPUT"

      - name: Decide collect
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.check.outputs.status }}" = "missing" ]; then
            echo "collecting"
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "already complete"
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect (full, run_monitoring.py)
        if: steps.decide.outputs.go == '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SKIP_APIFY: "0"
          RECOLLECT_ALL: ${{ github.event.inputs.recollect_all == 'true' && '1' || '0' }}
          VIEW_MISSING_QUEUE_FILE: ${{ runner.temp }}/view_missing_queue_${{ steps.check.outputs.kdate }}.json
          VIEW_MISSING_TARGET_ONLY: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
        run: |
          export MONITORING_DATE=$(TZ=Asia/Seoul date -d 'yesterday' +%F)
          echo "MONITORING_DATE=${MONITORING_DATE}"
          cd scripts && python run_monitoring.py

      - name: Upload missing view diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missing-view-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/view_missing_events_*.jsonl
            ${{ runner.temp }}/view_missing_queue_*.json
          if-no-files-found: ignore
