name: Google Search Trends (구글 웹 검색량 수집)

# 구글 웹 검색 트렌드 11개 키워드를 한 액터씩 순차 수집한다.
# collect API는 액터를 비동기로 시작하므로 run id를 받아 종료까지 확인해야 한다.
# 고정 시간만 기다리면 느린 런과 다음 런이 겹쳐 Google 차단을 유발할 수 있다.
on:
  schedule:
    - cron: "0 21 * * *"   # 06:00 KST
  workflow_dispatch:
    inputs:
      count_only:
        description: "키워드 개수 API만 확인하고 수집 없이 종료"
        required: false
        default: false
        type: boolean

env:
  APP_URL: "https://influencer-seeding-mu.vercel.app"
  KEYWORD_COUNT: "11"
  GAP_SECONDS: "60"       # 액터 완료 뒤 다음 키워드까지 추가 냉각 시간

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 구글 트렌드 키워드 순차 수집 (kw=0..N)
        run: |
          set -u
          # 키워드 개수는 소스(lib/google-trend-groups)에서 API로 직접 읽어 하드코딩 드리프트를 없앤다.
          # (키워드 추가 시 KEYWORD_COUNT 깜빡해도 자동 반영). 조회 실패/비정상이면 KEYWORD_COUNT 폴백.
          n=$(curl -fsS "$APP_URL/api/google-trends/collect?count=1" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" | jq -r '.keywordCount // empty')
          case "$n" in ''|*[!0-9]*) n="${KEYWORD_COUNT}";; esac
          echo "키워드 개수 n=$n (KEYWORD_COUNT 폴백=${KEYWORD_COUNT})"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.count_only }}" = "true" ]; then
            echo "count_only=true — Apify 수집 없이 검증 완료"
            exit 0
          fi
          fail=0
          for i in $(seq 0 $((n - 1))); do
            code=$(curl -sS -o /tmp/o -w "%{http_code}" "$APP_URL/api/google-trends/collect?kw=$i" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
            echo "kw=$i → HTTP $code"; cat /tmp/o; echo

            if [ "${code:0:1}" != "2" ]; then
              echo "::warning::google-trends kw=$i HTTP=$code"
              fail=$((fail + 1))
            else
              run_id=$(jq -r '.runId // empty' /tmp/o)
              if [ -z "$run_id" ]; then
                echo "::warning::google-trends kw=$i runId missing"
                fail=$((fail + 1))
              else
                terminal=""
                status="UNKNOWN"
                # 최대 20분 동안 현재 액터 완료를 기다린 뒤에만 다음 키워드로 간다.
                for attempt in $(seq 1 40); do
                  run_json=$(curl -fsS "https://api.apify.com/v2/actor-runs/$run_id" \
                    -H "Authorization: Bearer ${{ secrets.APIFY_API_TOKEN }}" || true)
                  status=$(printf '%s' "$run_json" | jq -r '.data.status // "UNKNOWN"')
                  echo "kw=$i run=$run_id status=$status ($attempt/40)"
                  case "$status" in
                    SUCCEEDED)
                      dataset_id=$(printf '%s' "$run_json" | jq -r '.data.defaultDatasetId // empty')
                      dataset_json=$(curl -fsS "https://api.apify.com/v2/datasets/$dataset_id" \
                        -H "Authorization: Bearer ${{ secrets.APIFY_API_TOKEN }}" || true)
                      item_count=$(printf '%s' "$dataset_json" | jq -r '.data.itemCount // 0')
                      if [ "$item_count" -gt 0 ]; then
                        terminal=success
                      else
                        terminal=empty
                        status=EMPTY_DATASET
                      fi
                      break ;;
                    FAILED|TIMED-OUT|ABORTED) terminal=failed; break ;;
                  esac
                  sleep 30
                done
                if [ "$terminal" != "success" ]; then
                  echo "::warning::google-trends kw=$i actor=$status"
                  fail=$((fail + 1))
                fi
              fi
            fi

            if [ "$i" -lt "$((n - 1))" ]; then sleep "${GAP_SECONDS}"; fi
          done

          # 일부 키워드 실패는 나머지 수집을 보존한다. 전부 실패한 경우에만 hard fail.
          if [ "$fail" -ge "$n" ]; then
            echo "::error::google-trends 전건 실패($fail/$n) — 배포/API/Google 차단 확인($APP_URL)"
            exit 1
          fi
          echo "완료: 실패 $fail/$n"
