name: Google Ads sync — 바치케 유튜브 (읽기 전용)

# Google Ads 광고그룹×일 성과(비용·노출·TrueView 조회수) → Supabase ad_platform_daily. 2026-10-27.
# 범위: 광고그룹 이름에 'P바치'(사용자 결정). 광고 설정은 읽기만 한다(GAQL search 만 호출).
# 시트 수기값은 건드리지 않는다 — 병행 비교로 검증한 뒤에만 정본 전환.
# 2026-10-27 사용자 결정: 매일 자동 적재 시작(병행 비교 단계 — 리포트·대시보드는 아직 시트).
#   소급 14일(10/13~26) 일자별 대조는 끝남(무노출일 일치, 차이 ≤0.7% 후행 보정). 남은 검증 = 매일 안정적으로 도는지.
#   미실행 감시: scripts/cron_watchdog.py DAILY_DEADLINE_KST(마감 13:00 KST, 오늘 예약 성공 없으면 Slack).
#   매번 최근 10일을 다시 읽어 후행 보정을 흡수한다(upsert, 재실행 안전).
on:
  schedule:
    - cron: "20 21 * * *"   # 06:20 KST
    - cron: "20 2 * * *"    # 11:20 KST 백업(UTC 0시=KST 9시 드롭 구간 회피)
  workflow_dispatch:
    inputs:
      since:
        description: "시작일 YYYY-MM-DD (비우면 KST 어제부터 days일)"
        required: false
        default: ""
      until:
        description: "종료일 YYYY-MM-DD"
        required: false
        default: ""
      days:
        description: "since/until 비울 때 일수"
        required: false
        default: "10"
      dry_run:
        description: "true면 DB 미기록(건수만 출력)"
        type: boolean
        default: true

concurrency:
  group: google-ads-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Sync (공개 로그 — 건수만 출력)
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ vars.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ vars.GOOGLE_ADS_CUSTOMER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SINCE: ${{ github.event.inputs.since }}
          UNTIL: ${{ github.event.inputs.until }}
          DAYS: ${{ github.event.inputs.days || '10' }}
          # 예약 실행은 inputs 가 없으므로 적용 모드로 고정
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run }}
          PYTHONUTF8: "1"
        run: python scripts/google_ads_sync.py
