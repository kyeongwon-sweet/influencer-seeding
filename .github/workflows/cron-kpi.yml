name: KPI 현황 갱신 (매일 오전 10시)

# 홈 6월 KPI 카드 데이터 갱신 — 마케팅T [인지_쫀득바]/[인지_듬뿍바] [N월 현황] 시트 읽기(서비스계정).
# 시트만 읽는 가벼운 작업(Apify 비용 없음)이라 무거운 일일수집과 분리해 매일 오전 10시에 단독 실행.
# 매일 오전 10시(KST) = 01:00 UTC. GitHub 정각(:00) 부하 지연 회피 위해 :05분으로 둠 → 실제 ~10:05 전후.
#
# 🛡️ 크론 드롭 대비 다중화(2026-09-03): GitHub 스케줄은 간헐적으로 드롭된다. KPI는
#    마감 워치독(cron_watchdog DAILY_DEADLINE_KST, due 10:05 + grace 150 = 12:35 KST)에는
#    이미 잡혀 있었지만 **자동복구 경로가 없어** 드롭된 날엔 사람이 손으로 돌려야 했다.
#    (다른 일일 작업은 Apps Script 외부 트리거 → /api/ops/* 폴백이 대행한다.)
#    kpi/fetch는 month_label 스냅샷을 새로 넣고 그 달의 옛 행을 지우는 **멱등** 동작이라
#    여러 번 돌아도 결과가 같고, 오히려 시트를 낮에 수정한 경우 더 최신값으로 갱신된다.
#    12:05은 마감(12:35) 안이라 백업이 성공하면 워치독이 조용하고, 14:05은 마감 후
#    최후 복구용이다(그날 알림은 이미 갔지만 데이터는 살린다).
on:
  schedule:
    - cron: "5 1 * * *"   # 10:05 KST (기본)
    - cron: "5 3 * * *"   # 12:05 KST (드롭 대비 백업 — 마감 12:35 안)
    - cron: "5 5 * * *"   # 14:05 KST (최후 복구)
  workflow_dispatch:

# 배포 URL은 여기 한 곳에서만 관리. ⚠️ -mu(프로덕션 도메인)만 — -kwhwang-s-projects는 배포보호(SSO) 302로 차단됨.
env:
  APP_URL: "https://influencer-seeding-mu.vercel.app"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: KPI fetch (kpi/fetch)
        run: |
          code=$(curl -sS -o /tmp/kpi.out -w "%{http_code}" \
            "$APP_URL/api/kpi/fetch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat /tmp/kpi.out; echo ""
          echo "HTTP ${code}"
          [ "${code:0:1}" = "2" ] || { echo "::error::kpi/fetch 실패 HTTP=$code — 배포/URL 확인($APP_URL)"; exit 1; }
