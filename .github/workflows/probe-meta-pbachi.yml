name: Probe — 바치케 메타 광고 접근 점검 (manual, read-only, 건수만)

# /api/meta-ads-pbachi 를 날짜·계정별로 호출해 '읽히는지'와 건수만 출력한다(읽기 전용 GET 한 경로).
# ⚠️ 공개 레포 — 광고비·노출·ThruPlay 등 지표 값과 캠페인명은 로그에 찍지 않는다(2026-10-27 사용자 지시로
#    옛 실행 기록 삭제, 이 점검도 건수만으로 바꿈). 값 대조가 필요하면 로그인 브라우저·DB에서 한다.
on:
  workflow_dispatch:
    inputs:
      dates:
        description: "조회 날짜(쉼표 구분 YYYY-MM-DD)"
        required: true
        type: string
      account:
        description: "main=전환 메인 계정 / awareness=인지 계정"
        type: choice
        options: [main, awareness]
        default: main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query /api/meta-ads-pbachi (counts only)
        env:
          APP_URL: "https://influencer-seeding-mu.vercel.app"
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DATES: ${{ github.event.inputs.dates }}
          ACCOUNT: ${{ github.event.inputs.account }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base, sec, acct = os.environ["APP_URL"].rstrip("/"), os.environ["CRON_SECRET"], os.environ["ACCOUNT"]
          for d in [x.strip() for x in os.environ["DATES"].split(",") if x.strip()]:
              url = f"{base}/api/meta-ads-pbachi?date={d}&account={acct}"
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + sec})
              try:
                  j = json.load(urllib.request.urlopen(req, timeout=90))
                  objs = {k: v.get("ads") for k, v in (j.get("byObjective") or {}).items()}
                  print(f"{d} account={j.get('account')} OK 계정광고행={j.get('scanned')} P바치광고={j.get('matched')} 목적별광고수={objs}")
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  try:
                      err = json.loads(body)
                      msg = (err.get("meta") or {}).get("message") or err.get("error")
                  except Exception:
                      msg = body[:120]
                  print(f"{d} account={acct} HTTP {e.code} {str(msg)[:160]}")
          PY
