        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          token=os.environ["SLACK_BOT_TOKEN"]
          channel=os.environ["TARGET_CHANNEL"]
          timestamps=[x for x in os.environ["TARGET_TIMESTAMPS"].split(",") if x]
          def api(method,payload):
              request=urllib.request.Request(
                  f"https://slack.com/api/{method}",
                  data=urllib.parse.urlencode(payload).encode(),
                  headers={"Authorization":f"Bearer {token}"},
              )
              with urllib.request.urlopen(request,timeout=30) as response:
                  result=json.load(response)
              if not result.get("ok"):
                  raise RuntimeError(result.get("error"))
              return result
          deleted=0
          failures=[]
          for ts in timestamps:
              try:
                  api("chat.delete",{"channel":channel,"ts":ts})
                  deleted+=1
              except Exception as exc:
                  failures.append({"ts":ts,"error":str(exc)})
              time.sleep(1.1)
          print(f"Targeted={len(timestamps)} Deleted={deleted} Failed={len(failures)}")
          if failures:
              print(json.dumps(failures))
              raise SystemExit(1)
          PY

