name: Slack post as 여믄봇 (manual)

# 여믄봇(SLACK_BOT_TOKEN)으로 임의 채널에 텍스트(+선택 이미지)를 수동 게시한다.
# 이미지는 파일 업로드가 아니라 공개 image_url 블록으로 렌더한다(lunchlab-weekly-menu 패턴).
# 여믄봇이 대상 채널의 멤버여야 게시된다.
on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: "대상 채널 ID (예: C0B68RVBMK5 = #제과_아무말대잔치)"
        required: true
        type: string
      text:
        description: "메시지(mrkdwn). 하이퍼링크는 <URL|라벨> 형식"
        required: true
        type: string
      image_url:
        description: "선택: 공개 이미지 URL(image 블록으로 첨부). 비우면 텍스트만"
        required: false
        type: string
        default: ""
      image_alt:
        description: "선택: 이미지 대체 텍스트"
        required: false
        type: string
        default: "image"
      unfurl_links:
        description: "링크 미리보기 사용"
        required: false
        type: boolean
        default: false
      update_ts:
        description: "설정 시 새 게시 대신 이 ts 메시지를 chat.update로 수정"
        required: false
        type: string
        default: ""

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack as 여믄봇
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL_ID: ${{ github.event.inputs.channel_id }}
          MSG_TEXT: ${{ github.event.inputs.text }}
          IMAGE_URL: ${{ github.event.inputs.image_url }}
          IMAGE_ALT: ${{ github.event.inputs.image_alt }}
          UNFURL: ${{ github.event.inputs.unfurl_links }}
          UPDATE_TS: ${{ github.event.inputs.update_ts }}
        run: |
          python3 - <<'PY'
          import os, json, sys, urllib.request
          token = os.environ["SLACK_BOT_TOKEN"]
          channel = os.environ["CHANNEL_ID"].strip()
          text = os.environ["MSG_TEXT"]
          image_url = (os.environ.get("IMAGE_URL") or "").strip()
          image_alt = (os.environ.get("IMAGE_ALT") or "image").strip() or "image"
          unfurl = (os.environ.get("UNFURL") or "false").lower() == "true"
          update_ts = (os.environ.get("UPDATE_TS") or "").strip()
          if not token:
              print("SLACK_BOT_TOKEN 없음"); sys.exit(1)

          blocks = [{"type": "section", "text": {"type": "mrkdwn", "text": text}}]
          if image_url:
              blocks.append({"type": "image", "image_url": image_url, "alt_text": image_alt})

          if update_ts:
              method = "chat.update"
              payload = {"channel": channel, "ts": update_ts, "text": text, "blocks": blocks}
          else:
              method = "chat.postMessage"
              payload = {
                  "channel": channel,
                  "text": text,            # 알림/폴백용
                  "blocks": blocks,
                  "unfurl_links": unfurl,
                  "unfurl_media": unfurl,
              }
          req = urllib.request.Request(
              "https://slack.com/api/" + method,
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Authorization": "Bearer " + token,
                       "Content-Type": "application/json; charset=utf-8"},
          )
          r = json.load(urllib.request.urlopen(req, timeout=20))
          print("Slack", method, "ok=", r.get("ok"), "error=", r.get("error", ""), "ts=", r.get("ts", ""))
          if not r.get("ok"):
              sys.exit(1)
          PY
