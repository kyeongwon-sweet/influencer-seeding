# 아침 자동화 보장 라우트 수동 점검 — 스케줄 없음(workflow_dispatch 전용).
#
# 왜: `/api/ops/ensure-daily-audits`는 CRON_SECRET 인증이라 사람 브라우저·로컬에서 호출할 수 없다.
#     이 워크플로가 시크릿을 들고 대신 호출해 준다(검증 + 비상 수동 트리거 겸용).
#
# 평상시 실제 스케줄러는 **Apps Script 시간 트리거(09:40 KST)** 다.
# GitHub cron이 이 저장소에서 상시 3시간 지연 + 이틀 완전 누락한 실측(2026-08-06~07) 때문에
# 시각 보장을 구글 쪽에 맡기고, 여기는 점검용으로만 남긴다.
name: Ensure Daily Automations (수동 점검)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "판정만 하고 실제로 깨우지는 않음"
        type: boolean
        default: true

env:
  APP_URL: "https://influencer-seeding-mu.vercel.app"

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call ensure-daily-audits
        run: |
          q=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then q="?dry_run=1"; fi
          code=$(curl -sS -X POST -o /tmp/out.json -w "%{http_code}" \
            --max-time 120 \
            "$APP_URL/api/ops/ensure-daily-audits${q}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat /tmp/out.json
          echo ""
          echo "HTTP ${code}"
          # 2xx가 아니면 실패로 남긴다(조용한 실패 금지)
          [ "${code:0:1}" = "2" ] || { echo "::error::ensure-daily-audits failed HTTP=$code"; exit 1; }

      # 2026-10-27 추가: 자정 수집 시작 라우트(구글 트리거 00:05~00:35 KST가 평소 호출).
      #   라우트는 00~05시 KST에만 수집을 시작한다(낮에는 dry_run=false 여도 outside_midnight_window 로 무동작).
      - name: Call ensure-daily-collect
        run: |
          q=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then q="?dry_run=1"; fi
          code=$(curl -sS -X POST -o /tmp/collect.json -w "%{http_code}" \
            --max-time 120 \
            "$APP_URL/api/ops/ensure-daily-collect${q}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat /tmp/collect.json
          echo ""
          echo "HTTP ${code}"
          [ "${code:0:1}" = "2" ] || { echo "::error::ensure-daily-collect failed HTTP=$code"; exit 1; }

      # 2026-10-28 추가: 리포트 자가치유(ensure-daily-report) — 항상 probe=1(게시 여부만, dispatch·알림 없음).
      #   제품별 판정(byProduct: jd·pbachi)이 실제 채널 기준으로 맞는지 확인용. 값·지표는 응답에 없다.
      - name: Probe ensure-daily-report (게시 여부만)
        run: |
          code=$(curl -sS -X POST -o /tmp/report.json -w "%{http_code}" \
            --max-time 60 \
            "$APP_URL/api/ops/ensure-daily-report?probe=1" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat /tmp/report.json
          echo ""
          echo "HTTP ${code}"
          [ "${code:0:1}" = "2" ] || { echo "::error::ensure-daily-report probe failed HTTP=$code"; exit 1; }
