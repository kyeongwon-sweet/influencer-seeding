name: Audit C15 Linked Sheet Costs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preflight linked sheet and DB
        id: preflight
        env:
          APP_URL: "https://influencer-seeding-mu.vercel.app"
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/ops/repair-c15-costs-20260915" > preflight.json
          python - <<'PY'
          import json

          with open("preflight.json", encoding="utf-8") as file:
              payload = json.load(file)
          rows = payload.get("rows", [])
          summary = [
              {
                  "label": row.get("label"),
                  "sheetRow": row.get("sheetRow"),
                  "sheetCost": row.get("sheetCost"),
                  "sheetCostFormula": row.get("sheetCostFormula"),
                  "dbCost": (row.get("dbPost") or {}).get("cost"),
                  "evidenceCosts": row.get("evidenceCosts"),
                  "safe": row.get("safe"),
              }
              for row in rows
          ]
          print(json.dumps({"dry_run": payload.get("dry_run"), "rows": summary}, ensure_ascii=False))
          if len(rows) != 4 or any(not row.get("safe") for row in rows):
              raise SystemExit("C15 preflight did not approve exactly four rows")
          PY
